<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>
<title>IR Student Roadmap 2026/27</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style id="app-css">
:root{
  --bg:#f7f6fa; --surface:#ffffff; --surface-2:#efecf5; --ink:#1a1f2e; --ink-2:#464d5e; --ink-3:#5d6474;
  --line:#e1dcea; --navy:#012850; --navy-2:#6b3fb0; --accent:#7446b8; --lila:#9063CD; --hero:#012850;
  --ok:#2f7a4f; --ok-bg:#e5f2ea; --warn:#8a5600; --warn-bg:#fdf1d8; --bad:#b3261e; --bad-bg:#fbe5e3;
  --now:#6b3fb0; --now-bg:#efe7fa; --contact-bg:#fff4d6; --contact-line:#e8c55a; --contact-ink:#5a4300;
  --tbc:#a03f7b; --tbc-bg:#f9e6f1; --shadow:0 1px 2px rgba(1,40,80,.06),0 4px 14px rgba(1,40,80,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11131b; --surface:#1a1d29; --surface-2:#232736; --ink:#e9e9f1; --ink-2:#b7b9c9; --ink-3:#8a8d9e;
    --line:#2e3244; --navy:#c9b3f2; --navy-2:#c4a8f0; --accent:#c4a8f0; --lila:#a585dc; --hero:#0a1a35;
    --ok:#7fd0a0; --ok-bg:#183326; --warn:#f0c062; --warn-bg:#33290f; --bad:#ff9a92; --bad-bg:#3a1a18;
    --now:#c4a8f0; --now-bg:#2a2140; --contact-bg:#332a10; --contact-line:#8a6f1d; --contact-ink:#f4dc8f;
    --tbc:#f0a6d2; --tbc-bg:#3a1f30; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#11131b; --surface:#1a1d29; --surface-2:#232736; --ink:#e9e9f1; --ink-2:#b7b9c9; --ink-3:#8a8d9e;
  --line:#2e3244; --navy:#c9b3f2; --navy-2:#c4a8f0; --accent:#c4a8f0; --lila:#a585dc; --hero:#0a1a35;
  --ok:#7fd0a0; --ok-bg:#183326; --warn:#f0c062; --warn-bg:#33290f; --bad:#ff9a92; --bad-bg:#3a1a18;
  --now:#c4a8f0; --now-bg:#2a2140; --contact-bg:#332a10; --contact-line:#8a6f1d; --contact-ink:#f4dc8f;
  --tbc:#f0a6d2; --tbc-bg:#3a1f30; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--navy-2)}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;line-height:1.2;margin:0}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.hero{background:var(--hero);color:#fff;padding:24px 0 22px;border-bottom:5px solid var(--lila)}
.hero-top{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.hero-logo{height:88px;width:auto;max-width:240px;object-fit:contain}
@media (max-width:560px){.hero-logo{height:68px}}
.hero-logo:not(.hidden)+.hero-badge{border-left:1px solid rgba(255,255,255,.35);padding-left:16px;align-self:stretch}
.hero-badge{display:inline-flex;align-items:center;gap:8px;font:700 13px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.hero-badge i{width:12px;height:12px;border-radius:3px;background:var(--lila);display:inline-block}
.hero .kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:600}
.hero h1{font-size:clamp(26px,4.5vw,38px);margin:6px 0 8px;color:#fff}
.hero p{margin:0;max-width:680px;opacity:.9}
.notice{margin-top:14px;background:rgba(255,255,255,.12);border-left:3px solid var(--lila);padding:8px 12px;border-radius:4px;font-size:14px}
.controls{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0}
.controls .wrap{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--ink-2);font:600 14px Inter,sans-serif;padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#1a1030}}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#1a1030}
label.tog{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--ink-2);cursor:pointer}
.progress{flex:1 1 160px;min-width:150px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.bar{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--lila);width:0;transition:width .3s}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px Inter,sans-serif;padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--navy-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
main{padding:20px 0 40px}
.section-title{font-size:22px;margin:28px 0 12px}
.upnext{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.upnext .card{display:block;text-decoration:none;color:inherit;padding:12px 14px;cursor:pointer;border-top:3px solid var(--lila)}
.upnext .when{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.upnext .t{font-weight:600;margin-top:2px}
.upnext .empty{padding:14px;color:var(--ink-3)}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.bulk-msg{font-size:14px;color:var(--ok);font-weight:600}
.linkbtn{border:0;background:none;padding:0;font:inherit;color:var(--navy-2);text-decoration:underline;cursor:pointer}
.overdue-banner{display:block;width:100%;text-align:left;border:0;font-family:inherit;margin:10px 0 0;background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;cursor:pointer}
.phase{margin-top:30px}
.phase-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;border-bottom:2px solid var(--lila);padding-bottom:6px}
.phase-head h2{font-size:22px;color:var(--navy)}
.phase-head .range{font-size:13px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.phase-head .pcount{margin-left:auto;font-size:13px;color:var(--ink-3)}
.phase-blurb{color:var(--ink-2);font-size:14px;margin:8px 0 0}
.items{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:34px 1fr;gap:6px 10px;padding:14px 16px 14px 12px;position:relative}
.item.done{opacity:.62}
.item.done .ititle{text-decoration:line-through;text-decoration-color:var(--ink-3)}
.item.flash{outline:3px solid var(--accent);outline-offset:2px}
.chk{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:2px 0 0 4px;border:2px solid var(--ink-3);border-radius:7px;cursor:pointer;display:grid;place-content:center;background:var(--surface)}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk:focus-visible{outline:2px solid var(--navy-2);outline-offset:2px}
.ihead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ititle{font-weight:650;font-size:16px;font-weight:600}
.date{font-size:13px;font-weight:600;color:var(--ink-2)}
.item>div{min-width:0}
.b.past{background:var(--surface-2);color:var(--ink-3)}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.b{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.b.y1{background:var(--surface-2);color:var(--ink-2)}
.b.intl{background:var(--now-bg);color:var(--now)}
.b.over{background:var(--bad-bg);color:var(--bad)}
.b.now{background:var(--now-bg);color:var(--now)}
.b.soon{background:var(--warn-bg);color:var(--warn)}
.b.ok{background:var(--ok-bg);color:var(--ok)}
.b.tbc{background:var(--tbc-bg);color:var(--tbc)}
.b.key{background:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .b.key{color:#1a1030}}
:root[data-theme="dark"] .b.key{color:#1a1030}
.ibody{grid-column:2;color:var(--ink-2);font-size:14.5px}
.ibody p{margin:4px 0}
.ibody ul{margin:4px 0;padding-left:20px}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:13.5px}
.contact{grid-column:2;margin-top:6px;background:var(--contact-bg);border:1px solid var(--contact-line);border-left:5px solid var(--contact-line);border-radius:8px;padding:8px 12px;color:var(--contact-ink);font-size:14px}
.contact b.lbl{text-transform:uppercase;font-size:11.5px;letter-spacing:.06em;display:block;margin-bottom:2px}
.contact .who{display:block}
.contact a{color:inherit;font-weight:600}
.contact .meta{font-size:12.5px;opacity:.85}
.editbar{grid-column:2;display:flex;gap:6px;margin-top:6px}
.dir{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.dir .card{padding:14px 16px}
.dir h3{font-size:17px;color:var(--navy)}
.dir .role{font-size:13px;color:var(--ink-3);margin-bottom:6px}
.dir .problems{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--ink-2)}
.dir .cl{font-size:14px}
.dir .cl div{margin:1px 0}
.quick{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14.5px}
.quick th,.quick td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.quick th{background:var(--surface-2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.quick td:last-child{font-weight:600;color:var(--contact-ink);background:var(--contact-bg)}
.quick tr:last-child td{border-bottom:0}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--ink-3);font-size:13px}
footer .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.staffbar{display:none;background:var(--tbc-bg);border:1px dashed var(--tbc);color:var(--tbc);border-radius:10px;padding:10px 14px;margin:14px 0 0;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
body.editing .staffbar{display:flex}
.hidden{display:none!important}
.skip:focus{position:fixed;left:16px;top:16px;width:auto;height:auto;clip:auto;z-index:99;background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a:focus-visible,button:focus-visible,.upnext .card:focus-visible{outline:3px solid var(--lila);outline-offset:2px}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;max-width:640px;width:calc(100% - 32px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,25,.5)}
dialog form{padding:18px 20px}
dialog h3{margin-bottom:10px}
.f{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;font-size:13px;font-weight:600;color:var(--ink-2)}
.f input[type=text],.f input[type=date],.f input[type=email],.f select,.f textarea{font:14px Inter,sans-serif;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);width:100%}
.f textarea{min-height:90px;resize:vertical}
.f .hint{font-weight:400;color:var(--ink-3);font-size:12px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:400}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
@media (max-width:560px){
  .frow{grid-template-columns:1fr}
  .item{grid-template-columns:30px 1fr;padding:12px 12px 12px 8px}
  .phase-head .pcount{margin-left:0;width:100%}
}
@media print{
  .controls,footer .btn,.editbar,.staffbar,.upnext,.overdue-banner,.bulk,.linkbtn{display:none!important}
  body{background:#fff}
  .card{box-shadow:none}
}

/* ---- combined roadmap additions ---- */
.ctl-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;width:100%}
.controls .wrap{flex-direction:column;align-items:stretch}
.seg.prog button{font-size:15px;padding:7px 18px}
.seg.prog button[aria-pressed="true"]{background:var(--hero);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg.prog button[aria-pressed="true"]{background:var(--lila);color:#1a1030}}
:root[data-theme="dark"] .seg.prog button[aria-pressed="true"]{background:var(--lila);color:#1a1030}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px;border-top:1px solid var(--line);padding-top:8px}
.tabs button{border:0;background:transparent;color:var(--ink-2);font:600 14px Inter,sans-serif;padding:7px 12px;border-radius:8px 8px 0 0;cursor:pointer;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lila)}
.tabs button:hover{color:var(--ink)}
.lede{color:var(--ink-2);max-width:720px;margin:0 0 12px}
.welcome{padding:22px;margin-top:22px;border-top:4px solid var(--lila)}
.welcome h2{font-size:24px;color:var(--navy)}
.welcome p{color:var(--ink-2)}
.welcome-btns{display:flex;gap:10px;flex-wrap:wrap}
.btn.big{font-size:16px;padding:12px 18px}
/* deadline emphasis */
.item{border-left:5px solid var(--line)}
.item.st-now{border-left-color:var(--now)}
.item.st-soon{border-left-color:var(--warn)}
.item.st-over{border-left-color:var(--bad)}
.item.st-done{border-left-color:var(--ok)}
.item.is-key.st-none{border-left-color:var(--accent)}
.cd{color:var(--accent);font-weight:700}
.item.st-over .cd,.item.st-soon .cd{color:var(--warn)}
.upnext .card.u-now{border-top-color:var(--now)}
.upnext .card.u-close{border-top-color:var(--bad)}
.upnext .card.u-soon{border-top-color:var(--warn)}
.upnext .card .when{color:var(--ink-3)}
.upnext .card.u-now .when{color:var(--now)}
.upnext .card.u-close .when{color:var(--bad)}
.upnext .card.u-soon .when{color:var(--warn)}
.links a.see{font-weight:600}
/* guide */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.chip{display:inline-block;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600}
.chip:hover{border-color:var(--lila)}
.gcat{margin-top:26px}
.gcards{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.gcard{padding:0}
.gcard summary{cursor:pointer;padding:13px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;list-style:none}
.gcard summary::-webkit-details-marker{display:none}
.gcard summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);margin-right:4px;transition:transform .15s}
.gcard[open] summary::before{transform:rotate(45deg)}
.gtitle{font-weight:600;font-size:16px}
.gbody{padding:0 16px 14px 34px;color:var(--ink-2);font-size:14.5px}
.gbody p{margin:4px 0}.gbody ul{margin:4px 0;padding-left:20px}
.gbody .contact{margin-top:8px}
.gcard.flash,.dir .card.flash{outline:3px solid var(--accent);outline-offset:2px}
/* docs */
.doclist{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.doc{padding:11px 14px}
.doc .dt{font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.doc .dm{font-size:13px;color:var(--ink-3);margin-top:2px}
.doc .dn{font-size:13.5px;color:var(--ink-2);margin-top:4px;background:var(--surface-2);border-radius:6px;padding:6px 8px}
.docsum{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
/* editor */
.checks.scroll{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:7px;padding:6px 8px;flex-direction:column;flex-wrap:nowrap}
.checks.col{flex-direction:column}
.audrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.audrow strong{min-width:30px}
.dir .card:focus{outline:3px solid var(--lila);outline-offset:2px}
@media print{ .tabs,.welcome,.chips{display:none!important} #view-guide,#view-contacts,#view-docs{display:block!important} .gcard .gbody{display:block} }
@media (max-width:560px){ .controls{position:static} .tabs button{padding:7px 9px} }

/* ================= v3: top bar, menu, layout ================= */
html{scroll-padding-top:84px}
.topbar{position:sticky;top:0;z-index:40;background:var(--hero);color:#fff;transition:box-shadow .2s}
.topbar.scrolled{box-shadow:0 2px 14px rgba(0,0,0,.25)}
.topbar-in{display:flex;align-items:center;gap:14px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;flex:0 0 auto}
.brand-logo{height:40px;width:auto}
.brand-txt{display:flex;flex-direction:column;line-height:1.15}
.brand-t{font:700 16px "Source Serif 4",Georgia,serif;letter-spacing:.01em}
.brand-s{font-size:11.5px;opacity:.75;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mainnav{flex:1 1 auto;display:flex;justify-content:center;min-width:0}
.mainnav .tabs{display:flex;gap:2px;border:0;margin:0;padding:0}
.mainnav .tabs button{color:rgba(255,255,255,.78);border-radius:8px;padding:9px 12px;border-bottom:0;display:inline-flex;align-items:center;gap:7px;font:600 14px Inter,sans-serif;background:transparent;border:0;cursor:pointer;position:relative}
.mainnav .tabs button:hover{color:#fff;background:rgba(255,255,255,.08)}
.mainnav .tabs button[aria-selected="true"]{color:#fff;background:rgba(255,255,255,.12)}
.mainnav .tabs button[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-11px;height:3px;border-radius:3px 3px 0 0;background:var(--lila)}
.t-ico{font-size:14px;opacity:.85;width:16px;text-align:center}
.bar-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:999px;padding:6px 12px 6px 6px;font:600 14px Inter,sans-serif;cursor:pointer}
.pill:hover{background:rgba(255,255,255,.18)}
.pill-prog{background:var(--lila);color:#fff;border-radius:999px;padding:3px 10px;font-weight:700}
.caret{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);display:inline-block;margin-left:2px}
.pill[aria-expanded="true"] .caret{transform:rotate(-135deg) translateY(-1px)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;font-size:17px;cursor:pointer;display:inline-grid;place-items:center}
.iconbtn:hover{background:rgba(255,255,255,.18)}
.burger{display:none;gap:4px;padding:0}
.burger span{display:block;width:18px;height:2px;background:#fff;border-radius:2px;margin:2px auto}
.topbar :focus-visible{outline:3px solid var(--lila);outline-offset:2px}

.menu{position:absolute;right:max(16px, calc((100vw - 980px)/2 + 16px));top:calc(100% + 6px);width:min(420px, calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(1,20,45,.28);z-index:50}
.menu-in{padding:16px}
.menu-sec+.menu-sec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.menu-h{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:8px}
.menu-note{font-size:12.5px;color:var(--ink-3);margin:8px 0 0}
.progcards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.progcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-family:inherit}
.progcard:hover{border-color:var(--lila)}
.progcard[aria-pressed="true"]{border-color:var(--accent);background:var(--now-bg)}
.pc-l{font:700 22px "Source Serif 4",Georgia,serif;color:var(--navy)}
.pc-t{font-size:13px;font-weight:600}
.pc-s{font-size:12px;color:var(--ink-3)}
.yearbtns,.menu-tabs{display:flex;flex-wrap:wrap;gap:6px}
.yearbtns button,.menu-tabs button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 13px;font:600 14px Inter,sans-serif;cursor:pointer}
.yearbtns button:hover,.menu-tabs button:hover{border-color:var(--lila)}
.yearbtns button[aria-pressed="true"],.menu-tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.menu-tabs{flex-direction:column}
.menu-tabs button{border-radius:10px;text-align:left;display:flex;gap:8px;align-items:center}
.menu-foot{display:flex;justify-content:flex-end;margin-top:14px}
.mobile-only{display:none}

.hero{padding:26px 0 24px}
.hero h1{margin-top:4px}

/* toolbar */
.toolbar{margin-top:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.tb-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.tb-opts{font-size:14px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 10px}
.search:focus-within{border-color:var(--lila);box-shadow:0 0 0 3px color-mix(in srgb, var(--lila) 25%, transparent)}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:15px Inter,sans-serif;padding:9px 0;min-width:0}
.search input:focus{outline:none}
.search.wide{display:flex;max-width:520px;margin-bottom:12px}
.s-ico{color:var(--ink-3);font-size:18px}
.search-info{font-size:14px;color:var(--ink-2)}
.toolbar .progress{flex:0 1 240px}
.allnote{margin-top:12px;background:var(--now-bg);color:var(--now);border-radius:10px;padding:10px 14px;font-size:14px}

/* two-column layout with section sidebar */
.layout{display:block}
.toc{display:none}
@media (min-width:1180px){
  .wrap{max-width:1180px}
  .layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start}
  .toc{display:block;position:sticky;top:84px;margin-top:24px}
  .menu{right:max(16px, calc((100vw - 1180px)/2 + 16px))}
}
.toc-in{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px}
.toc-h{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:0 6px 6px}
.toc ol{list-style:none;margin:0;padding:0}
.toc li a{display:flex;justify-content:space-between;gap:8px;padding:7px 8px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-size:14px;font-weight:500;border-left:3px solid transparent}
.toc li a:hover{background:var(--surface-2);color:var(--ink)}
.toc li.cur a{border-left-color:var(--lila);color:var(--ink);font-weight:700;background:var(--now-bg)}
.toc li.done a{color:var(--ink-3)}
.toc li.done .tc{color:var(--ok)}
.tc{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.section-title.first{margin-top:24px}

/* phases: collapsible */
.ph-toggle{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit;text-align:left}
.ph-toggle h2{margin:0}
.chev{width:9px;height:9px;border-right:2.5px solid var(--accent);border-bottom:2.5px solid var(--accent);transform:rotate(45deg);transition:transform .15s;flex:0 0 auto;margin-bottom:4px}
.collapsed .chev{transform:rotate(-45deg);margin-bottom:0}
.ph-sum{margin:8px 0 0;color:var(--ink-3);font-size:14px}
.phase.collapsed .phase-head{opacity:.85}
.b.here{background:var(--lila);color:#fff}
.phase.is-current .phase-head{border-bottom-width:3px}

/* completed items: green + strike-through */
.item.st-done{opacity:.72;background:color-mix(in srgb, var(--ok-bg) 45%, var(--surface))}
.item.st-done .ititle{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--ink-3);color:var(--ink-2)}
.item.st-done .ibody,.item.st-done .contact{opacity:.8}
.item.st-done:hover,.item.st-done:focus-within{opacity:1}
.chk:disabled{opacity:.35;cursor:not-allowed}
.chk{transition:transform .1s}
.chk:active{transform:scale(.9)}

/* toast + back to top */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.totop{position:fixed;right:18px;bottom:22px;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:20px;cursor:pointer;z-index:55;box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* dark mode polish */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .topbar{background:#0b1730;border-bottom:1px solid #22304d}
  :root:not([data-theme="light"]) .hero{background:linear-gradient(180deg,#0b1730,#141a2e)}
  :root:not([data-theme="light"]) .pc-l{color:var(--navy)}
}
:root[data-theme="dark"] .topbar{background:#0b1730;border-bottom:1px solid #22304d}
:root[data-theme="dark"] .hero{background:linear-gradient(180deg,#0b1730,#141a2e)}

/* mobile */
@media (max-width:880px){
  .mainnav{display:none}
  .burger{display:inline-grid}
  .mobile-only{display:block}
  .brand-s{max-width:150px}
  .menu{right:16px}
  .pill{padding:5px 10px 5px 5px;font-size:13px}
}
@media (max-width:480px){
  .brand-txt{display:none}
  .pill-year{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hero-logo{height:56px}
}
@media print{ .topbar,.toolbar,.toc,.totop,.toast{display:none!important} .ph-body[hidden]{display:block!important} }

@media (min-width:881px){ .mobile-only + .menu-sec{border-top:0;margin-top:0;padding-top:0} }
.th-ico{display:inline-flex;vertical-align:-3px;margin-right:6px}
#theme-opts button{display:inline-flex;align-items:center}

body.has-prog .hero-top{display:none}
body.has-prog .hero{padding:22px 0 20px}
.pill-prog,.b.here{background:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill-prog,:root:not([data-theme="light"]) .b.here{color:#1a1030}}
:root[data-theme="dark"] .pill-prog,:root[data-theme="dark"] .b.here{color:#1a1030}

#app{display:contents}
.wrap{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.topbar{top:env(safe-area-inset-top, 0px)}
.restore-bar{margin-top:14px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;font-weight:600}
.totop{right:calc(18px + env(safe-area-inset-right, 0px));bottom:calc(22px + env(safe-area-inset-bottom, 0px))}
.toast{bottom:calc(22px + env(safe-area-inset-bottom, 0px))}

/* announcements */
.ann{margin-top:18px}
.ann-head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.ann-h{font-size:20px;color:var(--navy)}
.ann-st{font-size:13px;color:var(--ink-3)}
.ann-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin-top:10px}
.ann-card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--lila);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.ann-card.imp{border-left-color:var(--bad);background:color-mix(in srgb, var(--bad-bg) 40%, var(--surface))}
.ann-card.dism{opacity:.6}
.ann-top{display:flex;gap:8px;align-items:flex-start}
.ann-top h3{font:600 16px/1.35 Inter,sans-serif;flex:1;margin:0}
.ann-top .b{margin-top:2px}
.ann-x{border:0;background:transparent;color:var(--ink-3);font-size:15px;cursor:pointer;border-radius:6px;padding:2px 6px;line-height:1}
.ann-x:hover{background:var(--surface-2);color:var(--ink)}
.ann-meta{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.ann-body{font-size:14.5px;color:var(--ink-2)}
.ann-body p{margin:6px 0 0}
.ann-empty{color:var(--ink-3);font-size:14px;margin:6px 0 0}
.bell{position:relative;font-size:16px}
.bell-n{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;font:700 11px/18px Inter,sans-serif;min-width:18px;height:18px;border-radius:9px;padding:0 4px}
.b.upd{background:var(--ok-bg);color:var(--ok)}
.updnote{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:6px 10px;margin:4px 0 6px;font-size:14px}

.gnote{background:var(--now-bg);color:var(--now);border-radius:10px;padding:10px 14px;font-size:14px;margin:4px 0 8px}
.gnote a{color:inherit;font-weight:700}

   "body": "Bring these to the Academic Registrar’s Office (ARO), **Room 2.53A, 2nd floor, North Building**, at enrolment. The official list is in the TáTK FAQ for accepted students (linked below).\n- **Entry qualification, original + photocopy:** secondary school diploma (BA) or bachelor’s diploma (MA)\n- Official English translation of the diploma, if it is not in English\n- Language certificate, if your programme requires one\n- Enrolment sheet, printed from Neptun, **2 signed copies**\n- Passport (both, if you have dual citizenship)\n- One 4×4 cm passport photo\n- Residence permit and Hungarian tax card, if you already have them (originals + copies)\n- Under 18? A signed authorisation from your legal guardian\nNo apostille or notarisation is needed for the originals.",

   "info": false,
   "body": "The BA is **180 credits** over 6 semesters (about 30 credits per semester). Students admitted from 2025 follow the 2025 curriculum. Check the official structure page for your admission year.\n**Semester 1 compulsory courses (28 cr):** Introduction to Political Science (IRB100), Introduction to Law (IRB101), Introduction to Economics I (IRB102), Reading Academic Texts (IRB103), Awareness Training (IRB104), Introduction to International Law (IRB106), History of European Integration (IRB107), Introduction to the History of International Relations (IRB150).\nMany 2nd-semester courses require a 1st-semester course to be passed first (e.g. Academic Writing needs Reading Academic Texts), so take all of them now.",

   "info": false,
   "body": "The MA is **120 credits** over 4 semesters: 58 compulsory · 25 mandatory electives (regional & thematic) · 30 specialisation · 7 optional (any ELTE course).\n**Semester 1 compulsory courses (27 cr):** Democratic decision-making (IRm04), International organizations (IRm05), Institutions of human rights protection (IRm07), International development policy (IRm09), European politics (IRm11), Security studies (IRm12), Academic writing (IRm15).\nAcademic writing (IRm15) is a prerequisite for **every** specialisation, so take it in semester 1.\nCheck the official structure page for the curriculum that applies to your admission year.",

   "tbc": false,
   "key": true,
   "info": false,
   "body": "**Semester 3 compulsory courses:** Security Studies (IRB115), Policies of the EU (IRB117), Policy Areas of the EU (IRB118), Foreign Policy Analysis (IRB119), Foreign Policy & Security Issues Seminar (IRB120), Research Methodologies (IRB152).\n**Regional Civilization Studies: all four are compulsory.** African & Middle East (IRB140), Asian (IRB141), American (IRB142) and European Studies (IRB143), 5 credits each, recommended in semesters 3–4. Check which ones run in autumn and which in spring, and plan both semesters now. If you can’t fit them all into semesters 3–4, ask the ARO about semester 5. All four must be completed before you graduate.\nCheck you passed the prerequisites (e.g. IRB115 needs IRB111), and check Neptun → Finances for unpaid items, which can block registration.",

    "id": "g-registration",
    "cat": "study",
    "title": "How course registration works (ranking, lucky point)",
    "for": [],
    "body": "At TáTK, course registration has two phases:\n- **Ranking period:** you register, and places are allocated by your ranking and the course capacity. When the period ends, Neptun “cuts” students below the capacity line\n- **First-come, first-served:** remaining places go to whoever registers first. Some courses open only now\nIf students have the same rank and a course is oversubscribed, Neptun uses a random **“lucky point”**, fixed per student and course. Deregistering and re-registering doesn’t change it.\n**What this means for you:** registering once doesn’t guarantee a seat. Check your registered subjects after the ranking period. After the registration period closes, you can’t change your courses without a request (and possibly a fee).\nYou must be **active** for the semester before you can register at all.",
    "links": [

    "id": "g-exams",
    "cat": "study",
    "title": "Exams, offered grades, retakes and fees",
    "for": [],
    "body": "- **Offered grades:** some lecturers offer a grade based on coursework. Accept or reject it in Neptun by the deadline. It is never accepted automatically\n- **Attempts:** up to **3 attempts per subject in one exam period**, and **6 attempts in total**. If you fail the 6th, your student status ends\n- **Registering for the same course:** max. 3 times. Not completing it by the 3rd registration ends your student status\n- **Deregistering:** up to 24 hours before the exam\n- **No-show** without a justified absence: a fee is charged, and it may count as a failed attempt\n- **Retakes:** retaking a failed course in a later semester carries an administrative fee. The reviewer also reports a fee for the 2nd retake (3rd attempt) in the same exam period. Check the current fee list in Neptun\n- **Credit limit:** above 198 credits (BA) / 132 (MA), an excess-credit fee may apply",

    "title": "Canvas and Moodle: which one do I use?",

    "body": "ELTE is moving to **Moodle** as its only learning platform. For TáTK:\n- **Autumn 2026:** courses may still be on Canvas\n- **Mid-January 2027:** students get access to spring courses on Moodle\n- **February 2027:** Moodle goes live, and lecturers can run courses only on Moodle\nCanvas stays accessible for now, but it may close early for security reasons, so save the materials you want to keep. **Always use the platform named by your lecturer**, and check both if unsure.",
    "links": [
     "lms",
     "it-support"
    ],
    "contacts": [
     "teacher",
     "it"
    ],
    "tbc": false
   },
   {
    "id": "g-credit",
    "cat": "study",
    "title": "Credit transfer and course recognition",
    "for": [],
    "body": "If you studied elsewhere, you can ask for courses to be recognised. Submit a Neptun request with your official transcript and the course descriptions (syllabi). Do it early in the semester, because the decision affects what you still need to take.\nFor scholarship holders, credits from a previous institution don’t count towards the 36-credit annual minimum.",
    "links": [
     "aro",
     "faq-enrolled"
    ],
    "contacts": [
     "aro"
    ],
    "tbc": false
   },
   {
    "id": "g-regional",
    "cat": "study",
    "title": "BA: Regional Civilization courses (all four required)",
    "for": [
     "ba"
    ],
    "body": "The BA requires all four Regional Civilization courses: African & Middle East (IRB140), Asian (IRB141), American (IRB142) and European Studies (IRB143), 5 credits each. They are recommended in **semesters 3–4**. Check which run in autumn and which in spring. Many students finish one in semester 5, but **all four must be completed before graduation**. Ask the ARO if you are unsure about your plan.",
    "links": [
     "ba-structure",
     "ba-curr-2025"
    ],
    "contacts": [
     "dept",
     "aro"
    ],
    "tbc": true
   },
   {
    "id": "g-tuition",
    "cat": "money",
    "title": "Tuition fees and deadlines",
    "for": [],
    "body": "- **New students:** the Letter of Acceptance gives the amount and an indicative **15-day** deadline\n- **Visa required:** pay the first semester **before the visa appointment**, at least a week before\n- **EEA / visa-waiver students:** **15 October** (autumn), **15 March** (spring)\n- **Scholarship holders** whose tuition is covered don’t pay\nPay through Neptun → Finances. The invoice appears the next day. Refund requests have the same deadlines (15 Oct / 15 Mar).",
    "links": [
     "faq-accepted",
     "refund"
    ],
    "contacts": [
     "finance"
    ],
    "tbc": false
   },
   {
    "id": "g-scholarship",
    "cat": "money",
    "title": "Stipendium Hungaricum & Diaspora: check-in and payments",
    "for": [],
    "body": "Each semester you must **verify your presence in Hungary in person** at the International Office, or the monthly stipend isn’t paid.\n- First get **active semester status** in Neptun\n- Book an appointment as described in your university email. The reviewer reports this is done through the Outlook booking system (“Scholarship Holders personal registration”), Room 228, 2nd floor\n- **Autumn:** check in by **30 September** to still get the September stipend (it may be paid with October’s). **Spring:** by the end of February\n- If you check in later, payments start only from that month\nYou also need a Hungarian bank account in Neptun and a tax card.",
    "links": [
     "sh-info",
     "sh-payment",
     "tax"
    ],
    "contacts": [
     "intl",
     "scholarship"
    ],
    "tbc": true
   },
   {
    "id": "g-card",
    "cat": "money",
    "title": "Student card and the validation sticker",
    "for": [],
    "body": "- Request your card after enrolment, at the start of your first active semester: get a **NEK document** at a Government Office (Kormányablak), then submit the request in Neptun\n- The card is only valid with a **validation sticker for the current semester**, free from the Quaestura Office\n- An autumn sticker is valid until **31 March**, and a spring sticker until **31 October**\n- Without a valid sticker, your student monthly pass isn’t valid either",
    "links": [
     "qter",
     "card-guide",
     "faq-enrolled"
    ],

    ],
    "tbc": false

   {
    "id": "g-thesis",
    "cat": "thesis",
    "title": "Thesis essentials: windows, supervisor, requirements",
    "for": [],
    "body": "- **Topic & supervisor windows:** 15 Oct – 15 Nov and 15 Apr – 15 May. **Changes:** by 15 Sep or 15 Feb\n- **Submission:** 15 April for June graduation (15 Nov for January). Register for the final exam by 15 March (or 15 Oct)\n- **Length (requirements v6, Nov 2026):** BA about 70,000 characters (±10,000), MA about 100,000 (±20,000), with spaces, excluding title page, contents and annexes\n- **Annexes:** title page (Annex 1), declaration of authenticity incl. AI-use declaration (Annex 2), AI-use summary table (Annex 3)\nThe requirements are updated often. **Always download them from the official page** right before you start formatting.",

   {
    "id": "g-clubs",
    "cat": "life",
    "title": "Clubs and communities",
    "for": [],
    "body": "Beyond the IR Society and your programme:\n- **ELTE International Student Ambassadors:** a university-wide network of international students\n- **ESN ELTE (Erasmus Student Network)** and the **Stipendium Hungaricum Mentor Network**\n- **Charity Club:** volunteering, awareness campaigns, work with NGOs\n- **Culture Club** and **Model United Nations (MUN) Club:** cultural events, debate and diplomacy practice (ask the Students’ Union for current contacts)\n- **Students’ Union (HÖK):** representation, events and student support\nSee the full list of ELTE student organisations for more.",

   {

    "cat": "life",

    "for": [],
    "body": "- **Sports for credit:** register in Neptun like any course (subject code **VTN**). It costs **HUF 6,000 per course per semester**, plus any venue supplement (e.g. swimming). Check the current course description\n- Some activities are taught mainly in Hungarian, so **email the instructor** to ask whether English is possible\n- **ELTE-BEAC** offers 40+ sports outside the credit system",

   {
    "id": "g-tdk",
    "cat": "life",
    "title": "TDK: do your own research project",
    "for": [],
    "body": "The Conference of Scientific Students’ Associations (TDK) lets BA and MA students present supervised research and get academic feedback. TáTK runs an **autumn and a spring edition**.\n- Pick a topic linked to the faculty’s fields\n- Find a supervisor **early**\n- Develop a research question, plan and method together\n- Follow the current call for registration and deadlines. Papers are 20–40 pages, in English or Hungarian\n- Present for about 15 minutes at the faculty conference. The best papers go on to the national conference",
    "links": [
     "tdk"
    ],
    "contacts": [
     "research",

    ],
    "tbc": false

   {
    "id": "g-mobility",
    "cat": "abroad",
    "title": "Options for studying abroad",
    "for": [],
    "body": "- **Erasmus+ semester exchange:** main faculty call usually in **February**, second call in **September**. TáTK requires at least **one completed semester** (the university-level rule may say two, so check the current call). SH and DFP holders aren’t eligible\n- **Erasmus+ traineeship:** an internship abroad, with different eligibility. See the traineeship FAQ\n- **Blended Intensive Programmes (BIP):** short physical stays combined with online work\n- **CEEPUS (Central Europe):** semester stays, or **short thesis-research stays of 1–2 months (min. 21 days)**, or 3–5-day excursions. Deadlines: **1 June** (autumn network mobility), **1 November** (spring network and freemover)\nContact coordinators early, because short-term options aren’t all advertised in one place.",

function matchQ(it){ if (!searchQ) return true; return (it.title + " " + it.body + " " + (it.dateLabel||"")).toLowerCase().indexOf(searchQ) > -1; }

function currentPhase(){
  var best = null, bestDate = null;
  DATA.phases.forEach(function(p){
    phaseItems(p).filter(visible).forEach(function(i){
      var st = status(i), e = d(i.end)||d(i.start);
      if (!e || ticks[i.id]) return;
      if (st==="now" && (!bestDate || e < bestDate || best && best.st!=="now")){ best = {id:p.id, st:"now"}; bestDate = e; }
      else if (e >= TODAY && (!best || (best.st!=="now" && e < bestDate))){ best = {id:p.id, st:""}; bestDate = e; }
    });
  });
  return best ? best.id : null;
}
function isCollapsed(p, visIts){

function download(name, text, type){
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type:type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function pad(n){ return String(n).padStart(2,"0"); }
function stamped(){
  var now = new Date(), stamp = now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
  var out = JSON.parse(JSON.stringify(DATA));
  out.meta.updated = stamp; out.meta.version = stamp + "-" + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
  return out;
}
function pageSource(data){
  var json = JSON.stringify(data, null, 1).replace(/<\//g, "<\\/");
  return '<title>'+esc(document.title)+'</title>'+HEAD_LINKS+'<style id="app-css">'+CSS_SRC+'</style>\n'+
    '<script id="guide-data" type="application/json">\n'+json+'\n</'+'script>\n'+
    '<template id="body-src">'+TPL+'</template><div id="app"></div>\n<script>'+SELF_JS+'</'+'script>';
}
function hostedDoc(data){
  var resetEl = document.head && document.head.querySelector("style");
  var reset = resetEl && resetEl.id !== "app-css" ? resetEl.textContent : "";
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+pageSource(data)+'</body></html>';
}
function fileDoc(data){
  return '<!DOCTYPE html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>\n'+pageSource(data)+'\n</body></html>\n';
}
function saveFile(name, text, type){
  if (HOST.hosted){
    if (!HOST.downloads){ toast("Downloads aren’t available in this view."); return; }
    HOST.downloads.save({filename:name, data:text}).catch(function(err){ if (err && err.code !== "cancelled" && err.code !== "declined") toast("The file couldn’t be saved here."); });
    return;
  }
  download(name, text, type);
}
function exportFile(){
  var out = stamped();
  saveFile((out.meta.fileStem||"Student_Roadmap") + "_" + out.meta.version + ".html", fileDoc(out), "text/html");
  if (!HOST.hosted){ drop("draft"); drop("editing"); }
}
function publishLive(){
  if (!HOST.artifact || !HOST.canEdit){ toast("You don’t have edit access to this page. Ask the owner to share it with you as an editor."); return; }
  var out = stamped();
  try{ sessionStorage.setItem(KEY+":attempt", JSON.stringify(out)); }catch(e){}
  toast("Publishing…");
  HOST.artifact.publish(hostedDoc(out)).then(function(){
    drop("draft"); drop("editing"); try{ sessionStorage.removeItem(KEY+":attempt"); }catch(e){}
    toast("Published. Everyone now sees the new version.");
  }).catch(function(err){
    var c = err && err.code;
    if (c === "conflict") toast("Another editor published first. The page is reloading to their version; you can restore your edits after it loads.");
    else if (c === "not_writer" || c === "not_granted" || c === "consent_required" || c === "capability_disabled"){ HOST.canEdit = false; try{ sessionStorage.removeItem(KEY+":attempt"); }catch(e){} toast("This view is read-only. Ask the owner to share the page with you as an editor."); render(); }
    else if (c === "rate_limited") toast("Too many publishes in a short time. Wait a minute, then publish again.");
    else if (c === "too_large") toast("The page is too large to publish. Remove a large logo or some content and try again.");
    else toast("Publishing failed. Your edits are still here; try again in a minute.");
  });
}
function icsDate(dt){ return dt.getFullYear()+pad(dt.getMonth()+1)+pad(dt.getDate()); }
function icsEsc(s){ return String(s).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/[,;]/g,function(c){return "\\"+c;}); }
function exportICS(){
  if (!P()) return;
  var name = (DATA.meta.calName||"ELTE deadlines") + " (" + P().label + ")";
  var lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ELTE POL-IR//Roadmap//EN","CALSCALE:GREGORIAN","X-WR-CALNAME:"+icsEsc(name)];
  ITEMS().filter(visible).forEach(function(it){
    var e = d(it.end) || d(it.start); if (!e) return;
    var s = d(it.start) && d(it.end) && +d(it.start) !== +d(it.end) ? d(it.start) : e;
    var e2 = new Date(e); e2.setDate(e2.getDate()+1);
    var c = (it.contacts||[]).map(function(k){ var x=DATA.contacts[k]; return x ? x.short+(x.email?" ("+x.email+")":"") : ""; }).filter(Boolean).join(", ");
    var desc = it.body.replace(/\*\*/g,"") + (c ? "\n\nProblem? Contact: " + c : "") + (it.tbc ? "\n\n(Date to be confirmed)" : "");
    lines.push("BEGIN:VEVENT","UID:"+it.id+"-"+prefs.prog+"@"+KEY,"DTSTAMP:"+icsDate(new Date())+"T000000Z",
      "DTSTART;VALUE=DATE:"+icsDate(s),"DTEND;VALUE=DATE:"+icsDate(e2),"SUMMARY:"+icsEsc(it.title),"DESCRIPTION:"+icsEsc(desc),
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(it.title),"TRIGGER:-P2D","END:VALARM","END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  saveFile(name.replace(/\W+/g,"_")+".ics", lines.join("\r\n"), "text/calendar");
}

document.addEventListener("keydown", function(e){
  if (e.key==="Escape" && menuOpen){ setMenu(false); ($("#burger").offsetParent ? $("#burger") : $("#picker-btn")).focus(); return; }
  if (e.key==="/" && !/input|textarea|select/i.test((e.target.tagName||"")) && prefs.tab==="checklist" && P()){ e.preventDefault(); $("#q").focus(); return; }
  var t = e.target; if (!t.matches || !t.matches('[role="tab"]')) return;
  var i = TABS.findIndex(function(x){ return x[0]===t.dataset.tab; });
  if (e.key==="ArrowRight"||e.key==="ArrowLeft"){ e.preventDefault(); var n = TABS[(i + (e.key==="ArrowRight"?1:-1) + TABS.length) % TABS.length][0]; setTab(n); $("#tab-"+n).focus(); }
});
document.addEventListener("click", function(e){
  if (menuOpen && !e.target.closest("#menu") && !e.target.closest("#picker-btn") && !e.target.closest("#burger")) setMenu(false);
  if (e.target.closest("#picker-btn") || e.target.closest("#burger")){ setMenu(!menuOpen); return; }
  if (e.target.closest("#menu-close")){ setMenu(false); return; }
  if (e.target.closest("#theme-btn")){ var i = THEMES.findIndex(function(t){ return t[0]===(prefs.theme||"auto"); }); prefs.theme = THEMES[(i+1)%THEMES.length][0]; save("prefs",prefs); render(); toast("Appearance: "+THEMES[(i+1)%THEMES.length][1]); return; }
  var thb = e.target.closest("[data-theme]"); if (thb && thb.tagName==="BUTTON"){ prefs.theme = thb.dataset.theme; save("prefs",prefs); render(); return; }
  if (e.target.closest("#bell")){ window.__showDismissed = false; var ab = $("#ann"); if (ab) ab.scrollIntoView({behavior:smooth(), block:"start"}); return; }
  if (e.target.closest("#totop")){ window.scrollTo({top:0, behavior:smooth()}); return; }
  var pg = e.target.closest("[data-prog]"); if (pg){ var wasNone = !P(); setProg(pg.dataset.prog); if (menuOpen || wasNone){ setMenu(true); } return; }
  var y = e.target.closest("#seg button"); if (y){ setYear(y.dataset.year); setMenu(false); toast("Showing "+P().label+" · "+(y.dataset.year==="all"?"all years":yLabel(+y.dataset.year))); return; }
  var tb = e.target.closest("[data-tab]"); if (tb){ e.preventDefault(); setTab(tb.dataset.tab); return; }
  var pj = e.target.closest("[data-phase-jump]"); if (pj){ e.preventDefault(); goPhase(pj.dataset.phaseJump); return; }
  var g = e.target.closest("[data-guide]"); if (g){ e.preventDefault(); goGuide(g.dataset.guide); return; }
  var ct = e.target.closest("[data-contact]"); if (ct){ e.preventDefault(); goContact(ct.dataset.contact); return; }
  var j = e.target.closest("[data-jump]");
  if (j){ e.preventDefault(); var it = ITEMS().find(function(x){ return x.id===j.dataset.jump; }); if (it){ expandPhase(it.phase); renderChecklist(); } var el = document.getElementById("it-"+j.dataset.jump); if (el){ el.scrollIntoView({behavior:smooth(), block:"center"}); var cb = el.querySelector(".chk"); if (cb) cb.focus({preventScroll:true}); flash(el); } return; }
  var b = e.target.closest("[data-act]"); if (!b) return;
  var a = b.dataset.act, idx;
  if (a==="toggle-edit"){ editing=!editing; save("editing",editing); if(editing) persistDraft(); render(); }
  else if (a==="collapse"){ var pid = b.dataset.phase, sec = document.getElementById(pid); prefs.collapsed = prefs.collapsed || {}; prefs.collapsed[pid] = !sec.classList.contains("collapsed"); save("prefs",prefs); renderChecklist(); var nb = document.querySelector('#'+pid+' .ph-toggle'); if (nb) nb.focus({preventScroll:true}); }
  else if (a==="toggle-all"){ var open = b.textContent.indexOf("Collapse")===0; prefs.collapsed = {}; DATA.phases.forEach(function(p){ prefs.collapsed[p.id] = open; }); save("prefs",prefs); renderChecklist(); }
  else if (a==="jump-today"){ var cur = currentPhase(); if (cur) goPhase(cur); }
  else if (a==="clear-q"){ searchQ = ""; $("#q").value = ""; renderChecklist(); $("#q").focus(); }
  else if (a==="share"){ var url = location.href.split("#")[0] + (prefs.prog ? "#"+prefs.prog : ""); var done = function(){ toast("Link copied."); }; var show = function(){ openDlg("Copy this link", '<label class="f">Link to this page<input type="text" readonly id="share-url" value="'+esc(url)+'"></label>', function(){}); form.querySelector('button[type=submit]').textContent = "Done"; var i = $("#share-url"); i.focus(); i.select(); }; try{ navigator.clipboard.writeText(url).then(done, show); }catch(err){ show(); } }
  else if (a==="edit-item") editItem(b.dataset.id);
  else if (a==="add-item") editItem(null, b.dataset.phase);
  else if (a==="del-item") confirmDlg("Delete this item?", function(){ DATA.items = DATA.items.filter(function(x){return x.id!==b.dataset.id;}); });
  else if (a==="up"||a==="down"){
    idx = DATA.items.findIndex(function(x){return x.id===b.dataset.id;});
    var ph = DATA.items[idx].phase, step = a==="up"?-1:1, k = idx+step;
    while (k>=0 && k<DATA.items.length && DATA.items[k].phase!==ph) k+=step;
    if (k>=0 && k<DATA.items.length){ var tmp=DATA.items[idx]; DATA.items[idx]=DATA.items[k]; DATA.items[k]=tmp; persistDraft(); render(); }
  }
  else if (a==="mark-past"||a==="mark-phase"||a==="unmark-phase"){
    if (!canTick()) return;
    undoTicks = JSON.parse(JSON.stringify(ticks));
    var cnt = 0;
    ITEMS().filter(visible).forEach(function(i){
      if (a==="mark-past"){ var ed = d(i.end)||d(i.start); if (ed && ed < TODAY && !ticks[i.id]){ ticks[i.id]=true; cnt++; } }
      else if (i.phase===b.dataset.phase){ if (a==="mark-phase"){ if (!ticks[i.id]) cnt++; ticks[i.id]=true; } else { delete ticks[i.id]; } }
    });
    saveTicks(); render(); if (a!=="unmark-phase") toast(cnt+" item"+(cnt===1?"":"s")+" marked as done for your "+yLabel(+curYear())+".");
  }
  else if (a==="undo"){ if (undoTicks){ ticks = undoTicks; undoTicks = null; saveTicks(); render(); toast("Undone."); } }
  else if (a==="edit-card") editCard(b.dataset.id);
  else if (a==="add-card") editCard(null, b.dataset.cat);
  else if (a==="del-card") confirmDlg("Delete this card?", function(){ var id=b.dataset.id; DATA.guide.cards = DATA.guide.cards.filter(function(x){return x.id!==id;}); DATA.items.forEach(function(i){ i.guide=(i.guide||[]).filter(function(x){return x!==id;}); }); });
  else if (a==="add-doc") editDoc(null);
  else if (a==="edit-doc") editDoc(b.dataset.key);
  else if (a==="doc-ok"){ var x = DATA.docs[b.dataset.key]; var n = new Date(); x.status="ok"; x.checked = n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate()); persistDraft(); render(); }
  else if (a==="del-doc"){ var used = docUsage(b.dataset.key); confirmDlg("Delete this link?"+(used?" It is used in "+used+" place(s) and will be removed from them.":""), function(){ var k=b.dataset.key; delete DATA.docs[k]; DATA.items.concat(DATA.guide.cards).forEach(function(i){ i.links=(i.links||[]).filter(function(x){return x!==k;}); }); }); }
  else if (a==="docs-only-check"){ window.__onlyCheck = !window.__onlyCheck; render(); }
  else if (a==="edit-contact") editContact(b.dataset.key);
  else if (a==="add-contact") editContact(null);
  else if (a==="del-contact") confirmDlg("Delete this contact? It will be removed from all items.", function(){ var k=b.dataset.key; delete DATA.contacts[k]; DATA.items.concat(DATA.guide.cards).forEach(function(i){ i.contacts=(i.contacts||[]).filter(function(x){return x!==k;}); }); });
  else if (a==="edit-phase") editPhase(b.dataset.phase);
  else if (a==="edit-meta") editMeta();
  else if (a==="export") exportFile();
  else if (a==="ann-dismiss"){ var dm = load("dismissed", {}); if (dm[b.dataset.id]) delete dm[b.dataset.id]; else dm[b.dataset.id] = 1; save("dismissed", dm); render(); }
  else if (a==="ann-toggle"){ window.__showDismissed = !window.__showDismissed; render(); }
  else if (a==="ann-refresh"){ fetchUpdates(true); toast("Checking for updates…"); }
  else if (a==="publish-live") confirmDlg("Publish your changes to everyone? Students who open the roadmap will see them right away.", publishLive);
  else if (a==="restore-attempt"){ try{ var at = JSON.parse(sessionStorage.getItem(KEY+":attempt")); sessionStorage.removeItem(KEY+":attempt"); at.meta.version = EMBED.meta.version; DATA = at; editing = true; save("editing", true); persistDraft(); render(); toast("Your unpublished edits are back. Check them, then publish again."); }catch(e){ toast("Nothing to restore."); } }
  else if (a==="dismiss-attempt"){ try{ sessionStorage.removeItem(KEY+":attempt"); }catch(e){} render(); }
  else if (a==="discard") confirmDlg("Discard all unsaved edits and go back to the original file?", function(){ drop("draft"); drop("editing"); DATA = JSON.parse(JSON.stringify(EMBED)); editing=false; applyLive(); });
  else if (a==="ics") exportICS();
  else if (a==="print") window.print();
  else if (a==="reset") confirmDlg("Clear all your ticks for "+(P()?P().label+" · "+yLabel(+curYear()):"this view")+"?", function(){ ticks={}; saveTicks(); });
});
window.addEventListener("hashchange", function(){ var h = location.hash.replace("#","").toLowerCase(), parts = h.split("-");
  if (["checklist","guide","contacts","docs"].indexOf(h) > -1){ setTab(h); return; }
  if (PROGS.some(function(p){return p.id===parts[0];})){ if (parts[0]!==prefs.prog) setProg(parts[0]); if (["checklist","guide","contacts","docs"].indexOf(parts[1]) > -1) setTab(parts[1]); } });
window.addEventListener("scroll", function(){ $("#totop").classList.toggle("hidden", window.scrollY < 900); $("#topbar").classList.toggle("scrolled", window.scrollY > 10); }, {passive:true});
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){ if ((prefs.theme||"auto")==="auto") render(); }); }catch(e){}

render();
fetchUpdates(true);
fetchGuide();
fetchLinks();
fetchContent();
function refreshDay(){ var old = +TODAY; setToday(); if (+TODAY !== old) render(); }
document.addEventListener("visibilitychange", function(){ if (!document.hidden){ refreshDay(); var before = UPD.lastTry; fetchUpdates(false); if (UPD.lastTry !== before){ fetchGuide(); fetchLinks(); fetchContent(); } } });
setInterval(refreshDay, 15*60*1000);
})();
</script>
